services:
  directus:
    image: directus/directus:11
    container_name: claread-directus
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      SECRET: ${SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      ROOT_REDIRECT: ${ROOT_REDIRECT}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_EXCLUDE_TABLES: ${DB_EXCLUDE_TABLES}
      EXTENSIONS_PATH: ${EXTENSIONS_PATH}
      EXTENSIONS_AUTO_RELOAD: ${EXTENSIONS_AUTO_RELOAD}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    # exec-form list (NOT a folded `>` scalar). A folded scalar would collapse
    # the boot command into a malformed string and the container could silently
    # exit 0 without starting Directus. Keep `/bin/sh -c` with a literal block
    # whose final/only statement is `exec npx directus start`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec npx directus start
    volumes:
      - ../../apps/directus/.runtime/uploads:/directus/uploads
      - ../../apps/directus/extensions/modules-bundle:/directus/extensions/directus-extension-claread-modules
      - ../../apps/directus/extensions/panels-bundle:/directus/extensions/directus-extension-claread-panels
      - ../../apps/directus/extensions/endpoints-bundle:/directus/extensions/directus-extension-claread-endpoints
      - ../../apps/directus/extensions/hooks-bundle:/directus/extensions/directus-extension-claread-hooks
