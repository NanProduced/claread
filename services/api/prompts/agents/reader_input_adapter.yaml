description: |
  输入适配 contract 说明（非运行 prompt）。
  用于与输入预处理 coding agent 对接，描述 Stable Reading Base 的输出 contract。
  来源：与输入预处理 coding agent 对接确认（2026-06-26）。
  定位：阶段二方案 C 的需求草案 / contract 说明；如未来需要 LLM 辅助输入适配，
  LLM 只参与生成/修复 Candidate Blocks 或质量判断，不成为所有输入的必经 deterministic adapter。

content: |
  # 输入适配 Contract 说明

  ## 核心原则：结构 truth 与 canonical text 分离

  输入预处理模块的输出必须拆成两个独立的 truth：

  ### 1. Stable Document Blocks（结构 truth）

  用途：Plate/Markdown 投影、RAG citation、table/image/footnote 保留。

  每个 block 包含：
  - block_type：paragraph / heading / list_item / blockquote / table / table_row / table_cell / footnote / image / image_ocr / caption / code_block / unknown
  - text_content：block 的纯文本内容（不含 Markdown 语法字符）
  - payload_json：结构化元数据（V1 子契约见下）
  - source_refs_json：来源引用（page number、artifact id、bbox 等）
  - quality_json：质量信号（ocr_confidence、degraded、warning 等）

  payload_json V1 子契约：
  - list_item：{ list_id, ordered, ordinal, depth, marker }，text_content 是项纯文本（不含 marker）
  - heading：{ level }，范围 1..6，超过 6 降级到 6 并在 quality_json 标记 heading_level_degraded
  - code_block：{ language, info_string }，text_content 是纯代码文本（不含围栏）

  canonical text 拼接规则：
  - interpretation_policy.default_route == "main_reading" 的 block 用 \n\n 连接
  - 默认进入：paragraph / heading / list_item / blockquote / caption
  - 默认不进入：table / table_row / table_cell / image / image_ocr / footnote / code_block / unknown

  注意：
  - divider 待补到后端 schema/migration，补上前用 unknown + payload_json 兜底
  - degraded block notice / page/source artifact reference 不做成正文 block，放入 payload_json/source_refs_json/quality_json
  - code_block（不是 "code block"）为统一命名
  - ordered/unordered list 后端用 list_item + payload_json 表达，前端投影还原 list grouping

  > Authoritative contract 见 docs/initiatives/reader-agentic-orchestration/modules/input-adapter.md 的"Stable Document Blocks 与 Plate Snapshot"section。本 yaml 为对接说明，非运行 prompt。

  ### 2. Canonical Text Layer（reading_bases.text，纯文本 truth）

  用途：UTF-16 offset、Reading Units、Anchor Segments、translation/vocabulary/grammar grounding。

  派生方式：从 main_reading blocks 的 text_content 以空行连接派生。
  - **不含 Markdown 语法字符**（#、-、>、代码围栏、GFM 表格、脚注语法不进入 offset 基准）
  - table/image/footnote 默认不进入 main canonical text；必要时由 Candidate confirm 显式提升
  - 阶段一 D4 只冻结 reading_bases.text；Stable Document Blocks 在 D6+ 冻结

  正确派生顺序：
  input artifact → normalized Stable Document Blocks → main_reading blocks.text_content → canonical plain text

  ## 渲染投影（前端消费方式）

  前端从 Stable Document Blocks 投影出渲染层，**不从 Markdown 字符串 strip 出 canonical text**：

  - **原文渲染**：Stable Document Blocks → Markdown/Plate 节点树 → Plate.js read-only editor 渲染（阶段二）
  - **译文（translation）**：纯文本固定样式（灰色小字 + 引用块边框），不走 Markdown
  - **词汇（vocabulary）**：纯文本 quick peek 浮层渲染，不走 Markdown
  - **grammar_note / sentence_analysis / ask_supplement**：Markdown callout 渲染（带图标、边框、背景色）

  ## 段落边界与 Reading Units

  - Stable blocks 定义一级语义边界
  - Canonical text 用 main_reading block 的 text_content 以空行连接
  - Unit builder 再按段落/句子做 segmentation
  - Markdown 空行可作为候选结构边界，但不应硬等同于 Reading Unit
  - 长段落可继续拆 anchor segments；列表项、heading、blockquote 可作为独立 unit 或受 segmenter 规则处理

  ## 阶段一现状与阶段二方向

  阶段一（当前 spike）：
  - D4 只冻结 reading_bases.text（纯文本）
  - 前端原文渲染仍基于纯文本 projection
  - 仅 callout（grammar_note / sentence_analysis）走 Markdown 渲染

  阶段二（方向）：
  - Stable Document Blocks 冻结后，前端原文渲染从 blocks 投影
  - translation/vocabulary 保持纯文本
  - grammar_note/sentence_analysis/ask_supplement 走 Markdown callout

  ## 不做的事情

  - 不把 reading_bases.text 直接改成 Markdown（会污染 offset 基准）
  - 不让 Markdown string → strip/deserialize → canonical offsets 成为主链路
  - 不翻译原文（translation layer 负责）
  - 不改写作者可见文本
  - 不加 AI 注释/摘要/导读
  - 不让 LLM 成为所有输入的必经 deterministic adapter（如未来用 LLM，只辅助 Candidate Blocks 生成/修复或质量判断）
