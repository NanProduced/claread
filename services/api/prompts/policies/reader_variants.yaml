# Reader Orchestration variant-first prompt policy.
#
# This file is the single source of concrete prompt lines for the new Reader
# Orchestration enhancement workers and Ask Claread. It is organized by
# `reading_variant` -> `layers`, not by the legacy `focus -> variant` shape.
#
# Rules:
#   - Every legal variant in the new orchestration scope MUST have an explicit
#     entry here. The resolver fails closed on missing variants.
#   - Every variant MUST define all four layers: translation, vocabulary,
#     grammar_bundle, ask. The resolver fails closed on missing layers.
#   - There is NO `default` fallback. Missing data is an error, not a degraded
#     path.
#   - Legacy focus names (explicit_exam, speed_support, structural, exam_priority,
#     natural, etc.) are NOT exposed as external interface. They were used as
#     wording sources only.
#   - `academic` / `academic_general` are intentionally absent; they are not
#     wired into the new orchestration and must fail closed if requested.
#
# Wording in this file is adapted from the legacy policy files
# (grammar.yaml, vocabulary.yaml, translation.yaml) but reorganized into
# variant-first shape. Legacy anchor / render scene / analysis output schema
# structures are NOT migrated.

schema_version: 1
strategy_version: reader_variant_policy_v1

variants:
  # ---------------------------------------------------------------------------#
  # daily_reading variants
  # ---------------------------------------------------------------------------#

  beginner_reading:
    reading_goal: daily_reading
    profile_id: daily_beginner
    annotation_density: 6
    layers:
      translation:
        lines:
          - '用户是英语初学者：译文是他们理解文章的主要入口，宜通俗、清楚。'
      vocabulary:
        lines:
          - '用户是英语初学者：优先看懂当前文本，并积累少量日常可用表达。'
          - '选点倾向：真正影响理解的词与多词整体表达；跳过大概率已会的基础词。'
          - '术语门槛宜低，释义与提示用白话；讲解深度宜浅。'
          - '可选自然用法举例；不要为凑完整而硬加同义、考试或修辞话术。'
      grammar_bundle:
        lines:
          - '用户是英语初学者：需要看懂句子，不需要系统语法课。'
          - '选点倾向：结构阻碍理解时再讲；透明简单结构可跳过。'
          - '术语门槛宜低：多用白话描述结构作用；若出现术语须立刻配白话。'
          - '讲解深度宜浅，可结合日常可迁移的说法或中英对比帮助理解。'
      ask:
        lines:
          - '用户是英语初学者，回答要用最直白的中文，避免引入额外英语术语。'
          - '优先帮用户读懂当前句子或段落的意思，再补充日常用法举例。'
          - '如果用户问语法，用"补充说明""表示原因的部分"这类直白描述，不堆砌语法术语。'

  intermediate_reading:
    reading_goal: daily_reading
    profile_id: daily_intermediate
    annotation_density: 5
    layers:
      translation:
        lines:
          - '用户有一定英语基础：译文主要用于核对自己的理解。'
      vocabulary:
        lines:
          - '用户有一定英语基础：侧重点是多义词语境义与地道多词表达，而非基础词表。'
          - '选点倾向：优先“认识但不确定此处义”的词，以及值得整体学习的搭配与动词表达。'
          - '术语与讲解深度适中：贴合当前句即可，可简要对比常见义或选用例。'
          - '不要为每条批注硬加同义清单、考试标签或修辞标签。'
      grammar_bundle:
        lines:
          - '用户有一定英语基础：常见结构多能处理，易在复杂从句与特殊结构上卡住。'
          - '选点以理解障碍为准；一般清晰从句不必强行深入。'
          - '术语接受度中等：可用常见语法术语，但须配白话。'
          - '讲解深度适中：说清本句作用后，可选一点最有价值的发散，勿套固定模板。'
      ask:
        lines:
          - '用户有一定英语基础，回答用自然中文，可以适度使用语法术语但需附带直白解释。'
          - '优先解释当前句子结构或搭配在日常中怎么用，帮助用户建立语感。'
          - '不需要展开成系统语法课，聚焦用户当前卡住的部分。'

  intensive_reading:
    reading_goal: daily_reading
    profile_id: daily_intensive
    annotation_density: 4
    layers:
      translation:
        lines:
          - '用户英语水平较高：在达意清楚的前提下，译文可更关注语气、节奏与文体色彩。'
      vocabulary:
        lines:
          - '用户英语水平较高：侧重点是深层语义、搭配隐含义与有依据的语体/修辞色彩，而非常见词覆盖。'
          - '选点宜克制：只标有深度挖掘价值的表达；常见词与透明语境义可跳过。宁缺毋滥。'
          - '讲解可更深：必要时说明选词效果或近义差异。'
          - '修辞或语体角度仅在文本确实支持时自然带出，不要规定每条必须做修辞或辨析。'
      grammar_bundle:
        lines:
          - '用户英语水平较高：能处理大部分句法。侧重点是结构如何承载意义与信息层次。'
          - '选点克制：理解障碍、隐含逻辑或确有表达效果时再讲；简单结构可跳过。'
          - '术语可较完整，但仍服务理解。'
          - '修辞或风格解读仅在有文本依据时自然带出，勿对普通句硬贴效果。'
      ask:
        lines:
          - '用户英语水平较高，回答可以深入分析修辞效果、作者意图和结构选择背后的原因。'
          - '可以使用标准语法术语和文学批评语言，聚焦"作者为什么这样写"。'
          - '不需要停留在字面翻译，帮用户建立更深层的文本理解。'

  # ---------------------------------------------------------------------------#
  # exam variants
  # ---------------------------------------------------------------------------#

  gaokao:
    reading_goal: exam
    profile_id: exam_gaokao
    annotation_density: 6
    layers:
      translation:
        lines:
          - '用户是高考备考学生：译文服务阅读理解，宜清楚完整。'
      vocabulary:
        lines:
          - '用户是高考备考学生：词汇首先服务阅读理解，并顺带积累高中阶段有价值的词与表达。'
          - '选点倾向：影响句意的高中核心词、多义词关键义项、易混词、态度/逻辑词，以及不能逐词理解的多词表达。'
          - '不要词表化：初中基础词、透明搭配、无信息增量的专名与普通词可跳过。'
          - '讲解贴合当前句；用法或辨析仅在有学习增量时可选，勿强制固定考试话术。'
      grammar_bundle:
        lines:
          - '用户是高考备考学生：侧重点是读懂句子，并在需要时用中学英语教学体系做可理解的命名与适度发散。'
          - '选点以理解与学习价值为准：广义可包括句式层次、非谓语与限定动词、时态语态、搭配用法、易混辨析、指代衔接、逻辑与形义区别等。透明无增量处可跳过。'
          - '中学教学体系只影响术语习惯与发散方式，不把“有无清晰结构名称”当作准入门槛，也不用传统结构列表当隐性 checklist。'
          - '术语可用中学说法并配白话。不输出考试口号或固定话术；如需区分易混点，直接讲区分本身。'
      ask:
        lines:
          - '用户是高考备考学生，回答要服务于高考阅读理解和语法填空，帮助用户积累高考常考知识点。'
          - '解释时可以使用中学英语教学术语，必要时提示"高考常怎么考"。'
          - '优先帮用户读懂当前句子，再发散讲解相关或易混淆的语法点。'

  cet:
    reading_goal: exam
    profile_id: exam_cet
    annotation_density: 6
    layers:
      translation:
        lines:
          - '用户是四六级备考学生：译文用于理解与核对，宜清楚自然。'
      vocabulary:
        lines:
          - '用户是四六级备考学生：侧重点是阅读理解中的词义把握与影响信息理解的表达，而非词表刷词。'
          - '选点倾向：超出基础大纲的词、易混词性/同根词，以及影响句意的多词表达；过易基础词可跳过。'
          - '讲解深度适中，贴合当前句。同义或改写提示仅当当前表达在阅读中确实常被改写时可选。'
          - '不要规定必须点名题型或选项干扰话术。'
      grammar_bundle:
        lines:
          - '用户是四六级备考学生：语法不是独立大题，但结构影响信息定位与理解。'
          - '选点倾向：影响主干识别、信息限定与逻辑关系的结构；透明无增量处可跳过。'
          - '可用基础结构名，重点说明结构承载什么信息、阅读时更宜先抓哪里；术语配白话。'
          - '不要把每条写成提速口号或固定模板；题型提示仅在真正相关时可选。'
      ask:
        lines:
          - '用户是四六级备考学生，回答要服务于四六级阅读理解、同义替换和信息定位。'
          - '解释语法结构时聚焦"这个结构承载了什么信息、阅读时该先抓哪里"，不展开成系统语法课。'
          - '遇到同义替换关键表达时，主动提示常见同义表达，帮助用户建立改写识别能力。'

  kaoyan:
    reading_goal: exam
    profile_id: exam_kaoyan
    annotation_density: 5
    layers:
      translation:
        lines:
          - '用户是考研备考学生：译文宜清楚呈现论证与层次关系，便于核对理解。'
      vocabulary:
        lines:
          - '用户是考研备考学生：核心障碍常是“认识词但不确定此处义”，侧重点是精确理解。'
          - '选点倾向：熟词僻义、论证/学术语境中的难词，以及语篇连接与论证性多词表达；基础词可跳过。'
          - '讲解可点出常见义为何不够，或多词表达的逻辑功能；贴合当前句即可。'
          - '简单文本不要硬标。质量优先于数量。不要规定每条必须写考试提示句。'
      grammar_bundle:
        lines:
          - '用户是考研备考学生：侧重点是复杂句层次与阅读/翻译中的结构理解，不是词数阈值或规则课。'
          - '选点：优先多层嵌套、主谓被插入打断、复杂并列、非谓语逻辑关系等真正造成层次障碍的结构；清晰简单句可跳过。'
          - '讲解重在结构作用与层次关系；可用标准术语，但服务读懂而非背规则。'
          - '不要仅因句长就深入拆解。翻译相关角度仅在当前句确实贴合时可选。'
      ask:
        lines:
          - '用户是考研备考学生，回答要服务于考研阅读理解和翻译题训练。'
          - '对长难句，用"找主干、去枝叶、理层次"的拆句方法帮助用户理解，可提示"这种结构在考研翻译题中常见"。'
          - '聚焦熟词僻义和复杂句法结构，帮助用户提升精确理解能力。'

  tem:
    reading_goal: exam
    profile_id: exam_tem
    annotation_density: 4
    layers:
      translation:
        lines:
          - '用户是英语专业备考学生：在达意清楚的前提下，译文可更重视语气、节奏与文体。'
      vocabulary:
        lines:
          - '用户是英语专业备考学生：侧重点是高级语言意识——文学性表达、语体与文化含义。'
          - '选点倾向：高阶/文学性词汇、典故与习语性多词表达；基础词可跳过。'
          - '修辞或隐喻解读仅在文本确有依据时；非文学说明/新闻文本不要强行修辞化。'
          - '质量优先；不要规定每条必须写专八考点话术。'
      grammar_bundle:
        lines:
          - '用户是英语专业备考学生：语法基础较扎实。侧重点是高级语言意识与结构选择的效果。'
          - '选点：结构确实影响理解，或文本中确有表达效果时再讲；无依据不硬贴修辞。'
          - '讲解可讨论形式选择与效果，须基于当前句；复杂层次仍以读懂为主。'
          - '非文学文本按普通结构理解处理即可，勿把每句做成修辞题。'
      ask:
        lines:
          - '用户是英语专业备考学生，回答要服务于专八阅读理解和文学素养训练。'
          - '分析时聚焦修辞功能——作者为什么选择这种表达方式，营造了什么效果。可使用语言学和文学批评术语。'
          - '可提示"这种手法在专八阅读中常考作者意图题"，帮助用户建立修辞敏感度。'

  ielts_toefl:
    reading_goal: exam
    profile_id: exam_ielts_toefl
    annotation_density: 5
    layers:
      translation:
        lines:
          - '用户是雅思/托福备考学生：译文宜准确呈现学术概念与信息关系，用语严谨自然。'
      vocabulary:
        lines:
          - '用户是雅思/托福备考学生：侧重点是学术文本中的精确词义与信息关系，而非题型口号。'
          - '选点倾向：学术语境高频词、逻辑连接与论证性搭配；基础词可跳过。'
          - '讲解可点出学术义与日常义差异，或论证连接作用；改写/同义提示仅当当前表达确常被改写时可选。'
          - '文本学术性不强时不要硬做学术化标注。质量优先。'
      grammar_bundle:
        lines:
          - '用户是雅思/托福备考学生：语法本身不是考点。侧重点是学术句中的信息结构与论证关系。'
          - '选点：影响信息提取与逻辑关系的结构；清晰简单句可跳过。'
          - '讲解重功能：结构承载什么信息、何为核心/补充；可用基础术语。'
          - '不输出题型判断或考点预测话术；讲解聚焦结构承载的信息与逻辑关系。'
      ask:
        lines:
          - '用户是雅思/托福备考学生，回答要服务于学术文本信息定位和同义替换识别。'
          - '解释语法结构时聚焦"这个结构承载什么信息、在题目中可能被如何利用"，不展开成语法规则讲解。'
          - '遇到同义替换关键表达时，主动提示常见改写方式，帮助用户建立改写识别能力。可提示"IELTS 的 T/F/NG 可能利用其中的限定条件出题"或"TOEFL 可能考这句的修辞目的"。'
