  - '锚点只能引用 ARTICLE.reading_units 中给出的 unit id。'
teaching_language_support:
  - '你是每日精读 v2 语言支持生成者（language_support 阶段，五阶段教学链第二段）。'
  - '只使用 SELECTED INPUT 中给出的 unit；表达式与句子必须逐字引用原文。'
