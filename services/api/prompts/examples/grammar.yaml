beginner_reading:
- example_type: sentence_analysis
  sentence_text: The boy who is wearing a red hat is my brother.
  output_fragment: '{"type": "sentence_analysis", "label": "拆解长句", "analysis_zh":
    "主干是 The boy is my brother（那个男孩是我弟弟）。中间 who is wearing a red hat 是补充说明男孩的，告诉我们是“戴红帽子的”那个男孩。先看主干，再看中间的补充说明。",
    "chunks": [{"order": 1, "label": "主干主语", "text": "The boy"}, {"order": 2, "label":
    "补充说明", "text": "who is wearing a red hat"}, {"order": 3, "label": "主干谓语宾语", "text":
    "is my brother"}]}'
- example_type: grammar
  sentence_text: He gave up smoking last year.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "gave up"}, {"text":
    "smoking"}], "label": "give up + 动词-ing", "note_zh": "give up 后面跟动词的 -ing 形式，表示“放弃做某事”。日常很常用，比如
    I gave up eating junk food（我戒掉了垃圾食品）。"}'
intensive_reading:
- example_type: sentence_analysis
  sentence_text: Rarely has a discovery so fundamentally altered our understanding
    of the cosmos.
  output_fragment: '{"type": "sentence_analysis", "label": "否定副词前置与修辞强调", "analysis_zh":
    "Rarely 前置触发倒装，强调“罕见性”。句子信息密度高，通过 altered our understanding 建立了发现与认知的关联。这种句式常用于学术或正式论述中，以增强语气。",
    "chunks": [{"order": 1, "label": "强调起点", "text": "Rarely has a discovery"}, {"order":
    2, "label": "核心动作", "text": "so fundamentally altered"}, {"order": 3, "label":
    "受影响对象", "text": "our understanding of the cosmos"}]}'
- example_type: sentence_analysis
  sentence_text: That such a modest proposal provoked outrage reveals more about the
    audience than the content.
  output_fragment: '{"type": "sentence_analysis", "label": "名词性从句前置与信息焦点", "analysis_zh":
    "That 引导的主语从句前置，将“引发愤怒”这一事实本身作为主语，使句子焦点自然落在 reveals 上——作者刻意将“令人意外”的信息结构化，暗示愤怒反应的不合理。这种结构比
    “It reveals...that...” 更有力，因为主语从句本身承载了作者的判断。", "chunks": [{"order": 1, "label":
    "事实主语", "text": "That such a modest proposal provoked outrage"}, {"order": 2,
    "label": "核心判断", "text": "reveals more about the audience than the content"}]}'
gaokao:
- example_type: grammar
  sentence_text: With several key questions still unanswered, the researchers were
    careful not to draw a final conclusion.
  output_fragment: '{"type":"grammar_note","spans":[{"text":"With several key questions
    still unanswered"}],"label":"with 复合结构","note_zh":"这是 with + 宾语 + 宾补 的复合结构，在句中作背景状语。several
    key questions 是宾语，still unanswered 是过去分词/形容词性成分作宾补，表示“问题仍未得到回答”。这种结构常用来交代主句动作发生的原因或背景，阅读时可先理解为“由于还有几个关键问题未解决”。"}'
- example_type: grammar
  sentence_text: The report describes a point at which small changes in temperature
    can lead to serious effects on local wildlife.
  output_fragment: '{"type":"grammar_note","spans":[{"text":"a point"},{"text":"at
    which"}],"label":"介词 + which 引导定语从句","note_zh":"a point 是先行词，at which 引导定语从句，相当于
    at the point where，表示“在这个点上”。后面的从句具体说明：在这个临界点上，温度的小变化会对当地野生动物产生严重影响。高考常考介词和关系代词的搭配，也常考先行词与从句含义的对应。"}'
- example_type: grammar
  sentence_text: It was not the cost of the program but the lack of public trust that
    made the plan difficult to carry out.
  output_fragment: '{"type":"grammar_note","spans":[{"text":"It was"},{"text":"that
    made the plan difficult to carry out"}],"label":"强调句型","note_zh":"这是强调句型 It is/was...that...，被强调部分是
    not the cost of the program but the lack of public trust。这个结构用来突出真正导致计划难以实施的原因不是成本，而是公众信任不足。高考常考强调句型的识别：去掉
    It was 和 that 后，句子仍能还原为 The lack of public trust made the plan difficult to carry
    out。"}'
- example_type: sentence_analysis
  sentence_text: We often enter public spaces surrounded by strangers who are busy
    checking messages, reading news, or simply avoiding eye contact.
  output_fragment: '{"type":"sentence_analysis","label":"分词状语 + 定语从句 + 并列动作","analysis_zh":"句子主干是
    We often enter public spaces。surrounded by strangers 是过去分词短语，说明进入公共空间时的伴随状态；who
    引导定语从句修饰 strangers，从句中 checking, reading, avoiding 是并列动作。阅读时先抓“我们进入公共空间”，再把后面的分词和定语从句看作对场景的层层补充。","chunks":[{"order":1,"label":"主句主干","text":"We
    often enter public spaces"},{"order":2,"label":"伴随状态","text":"surrounded by strangers"},{"order":3,"label":"定语从句主干","text":"who
    are busy checking messages"},{"order":4,"label":"并列动作","text":"reading news, or
    simply avoiding eye contact."}]}'
- example_type: sentence_analysis
  sentence_text: Although the study was designed to measure how much time teenagers
    spent reading for pleasure, its most important finding was that students who discussed
    books with their parents were more likely to keep reading as they grew older.
  output_fragment: '{"type":"sentence_analysis","label":"让步状语从句 + 表语从句 + 定语从句","analysis_zh":"句子主干是
    its most important finding was that...，真正的信息重点在 that 引导的表语从句中。句首 Although 从句只是交代研究原本的设计目的，其中
    how much time... 是 measure 的宾语从句。阅读时先抓主句“最重要的发现是什么”，再处理 who 定语从句和 as 时间状语，理解为：和父母讨论书的学生长大后更可能继续阅读。","chunks":[{"order":1,"label":"让步状语从句","text":"Although
    the study was designed to measure how much time teenagers spent reading for pleasure,"},{"order":2,"label":"主句主语+系动词","text":"its
    most important finding was"},{"order":3,"label":"表语从句主语","text":"that students"},{"order":4,"label":"定语从句","text":"who
    discussed books with their parents"},{"order":5,"label":"表语从句谓语","text":"were
    more likely to keep reading"},{"order":6,"label":"时间状语从句","text":"as they grew
    older."}]}'
cet:
- example_type: grammar
  sentence_text: The study, which was conducted by researchers from Harvard, found
    that regular exercise can reduce stress.
  output_fragment: '{"type":"grammar_note","spans":[{"text":"which was conducted
    by researchers from Harvard"},{"text":"found"}],"label":"非限制性定语从句","note_zh":"which
    was conducted by researchers from Harvard 是非限制性定语从句，补充说明 the study 的研究来源，不影响主句主干。阅读时先抓主干
    The study found that...，再回头看 which 从句补充了谁做的研究。"}'
- example_type: grammar
  sentence_text: Influenced by social media, young people tend to spend more time
    online.
  output_fragment: '{"type":"grammar_note","spans":[{"text":"Influenced by social
    media"},{"text":"young people tend to spend"}],"label":"过去分词短语作状语","note_zh":"Influenced
    by social media 是过去分词短语作原因状语，说明 young people tend to spend more time online 的背景原因。这个结构本身不是主干，阅读时先找主语和谓语，再回头补看句首分词说明了什么影响。"}'
- example_type: grammar
  sentence_text: Yet, what I found is that following one's passion does not necessarily
    lead to fulfillment, but is one of the most powerful cultural forces perpetuating
    overwork.
  output_fragment: '{"type":"grammar_note","spans":[{"text":"does not necessarily
    lead to fulfillment"},{"text":"but is one of the most powerful cultural forces
    perpetuating overwork"}],"label":"not ... but ... 对比结构","note_zh":"这里是 not ...
    but ... 对比结构，前半部分否定一种常见看法，but 后半部分给出作者真正强调的判断。语法上两个部分共同说明 following one''s passion 的结果；阅读时要特别留意
    but 后面的内容，因为那通常才是句子的重心。"}'
- example_type: sentence_analysis
  sentence_text: A recent study conducted by the University of Oxford has found that
    people who regularly engage in physical activity are less likely to develop heart
    disease.
  output_fragment: '{"type":"sentence_analysis","label":"主干 + 后置定语 + 宾语从句","analysis_zh":"主干是
    A recent study has found that...。conducted by the University of Oxford 是过去分词短语作后置定语，修饰
    study；that 引导宾语从句，其中 who regularly engage in physical activity 是定语从句修饰 people。第一遍阅读先抓研究发现了什么，再回头补看研究来源和
    people 的限定范围。","chunks":[{"order":1,"label":"主干主语","text":"A recent study"},{"order":2,"label":"后置定语","text":"conducted
    by the University of Oxford"},{"order":3,"label":"主干谓语","text":"has found"},{"order":4,"label":"宾语从句","text":"that
    people who regularly engage in physical activity are less likely to develop heart
    disease"}]}'
- example_type: sentence_analysis
  sentence_text: Colleges, workplaces and career counselors who promote the "follow
    your passion" path for everyone, without leveling the playing field, help perpetuate
    socioeconomic inequalities among career aspirants.
  output_fragment: '{"type":"sentence_analysis","label":"长主语 + 定语从句 + 插入状语","analysis_zh":"主干是
    Colleges, workplaces and career counselors help perpetuate socioeconomic inequalities。who
    promote... 是定语从句，修饰前面的三个主体；without leveling the playing field 是插入状语，补充这些主体是在什么条件下这样做的。阅读难点在于主语很长，所以第一遍先抓主语核心和谓语
    help perpetuate，再回头处理 who 从句和 without 短语。","chunks":[{"order":1,"label":"主语核心","text":"Colleges,
    workplaces and career counselors"},{"order":2,"label":"定语从句","text":"who promote
    the \"follow your passion\" path for everyone,"},{"order":3,"label":"插入状语","text":"without
    leveling the playing field,"},{"order":4,"label":"主句谓语宾语","text":"help perpetuate
    socioeconomic inequalities among career aspirants."}]}'
kaoyan:
- example_type: grammar
  sentence_text: The approach, which was initially designed for urban areas, has failed
    to address the needs of rural communities.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "which was initially
    designed for urban areas"}, {"text": "has failed"}], "label": "非限制性定语从句 + 主谓分离", "note_zh": "which
    引导非限制性定语从句修饰 the
    approach，可先跳过。主干是 The approach has failed to address...（这种方法未能解决……）。主语和谓语被从句拆开了，阅读时先跳过逗号之间的从句抓主干"}'
- example_type: grammar
  sentence_text: The findings, the researchers argue, challenge the prevailing assumption
    that economic growth inevitably reduces poverty.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "the researchers argue"},
    {"text": "that economic growth inevitably reduces poverty"}], "label": "插入语 + 同位语从句", "note_zh": "the
    researchers argue 是插入语，可先跳过。主干是
    The findings challenge the assumption（发现挑战了假设）。that 引导同位语从句解释 assumption 的内容。这种“插入语打断主谓”的结构在考研文本中很常见"}'
- example_type: sentence_analysis
  sentence_text: The study suggests that the approach, which was initially designed
    for urban areas, has failed to address the needs of rural communities, leading
    researchers to call for a fundamental revision of the policy.
  output_fragment: '{"type": "sentence_analysis", "label": "宾语从句 + 非限制性定语从句 + 分词结果状语",
    "analysis_zh": "主干：The study suggests that...（研究表明……）。that 引导宾语从句，从句主干是 the approach
    has failed to address...（这种方法未能解决……）。which was initially designed for urban areas
    是非限制性定语从句修饰 approach，可先跳过。leading researchers to call for... 是现在分词作结果状语，表示“导致研究人员呼吁……”。这种“主句
    + 宾语从句内嵌定语从句 + 分词状语”的多层嵌套结构是考研翻译题的高频出题点", "chunks": [{"order": 1, "label": "主干",
    "text": "The study suggests"}, {"order": 2, "label": "宾语从句主语", "text": "that the
    approach"}, {"order": 3, "label": "插入的定语从句", "text": "which was initially designed
    for urban areas"}, {"order": 4, "label": "宾语从句谓语宾语", "text": "has failed to address
    the needs of rural communities"}, {"order": 5, "label": "分词结果状语", "text": "leading
    researchers to call for a fundamental revision of the policy"}]}'
tem:
- example_type: grammar
  sentence_text: Never had she felt so alone, so utterly abandoned by the world.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "Never"}, {"text":
    "had she felt"}], "label": "倒装 + 反复", "note_zh": "Never 前置触发倒装，营造紧迫感和戏剧性——读者先被“从未”击中，再感受到主语的孤独。so...so...
    反复强化情绪的递进，从 alone 到 utterly abandoned，孤独感层层加深。这种倒装+反复的组合是文学文本中常见的情绪渲染手法，专八常考作者意图题"}'
- example_type: grammar
  sentence_text: The shadows lengthened, stretched across the empty room like the
    fingers of some unseen hand.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "lengthened"}, {"text":
    "stretched"}], "label": "动词并列 + 明喻", "note_zh": "lengthened 和 stretched 两个动词并列，赋予阴影主动性和侵入感——阴影不是被动存在，而是在“蔓延”。like
    the fingers of some unseen hand 是明喻，将阴影比作“看不见的手指”，营造不安和神秘氛围。这种动词选择+明喻的组合是文学描写中常见的氛围营造手法"}'
- example_type: sentence_analysis
  sentence_text: Had she known then what she knows now, she would never have opened
    that door, would never have stepped into the light that was, in truth, no light
    at all.
  output_fragment: '{"type": "sentence_analysis", "label": "虚拟倒装 + 反复否定 + 反讽", "analysis_zh":
    "Had she known 是虚拟条件句倒装，表达与过去事实相反的假设，奠定悔恨基调。would never have...would never have...
    反复否定强化不可挽回的遗憾感。that was, in truth, no light at all 是反讽——看似光明实则黑暗，暗示主角被表象蒙蔽。整句通过虚拟+反复+反讽的三重修辞，将悔恨和幻灭推向极致。这种手法在专八阅读中常考作者意图和态度判断",
    "chunks": [{"order": 1, "label": "虚拟假设", "text": "Had she known then what she
    knows now"}, {"order": 2, "label": "反复否定一", "text": "she would never have opened
    that door"}, {"order": 3, "label": "反复否定二", "text": "would never have stepped
    into the light"}, {"order": 4, "label": "反讽揭示", "text": "that was, in truth, no
    light at all"}]}'
ielts_toefl:
- example_type: grammar
  sentence_text: The factor that contributed most significantly to the decline was
    habitat loss.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "that contributed
    most significantly to the decline"}], "label": "限制性定语从句", "note_zh": "that 引导限制性定语从句，限定了是“哪个”
    factor——是导致衰退最显著的那个因素。这类限定信息在雅思
    T/F/NG 题中常被改写为判断对象，如果题目说“Habitat loss was the primary factor”，答案取决于原文的限定是否精确"}'
- example_type: grammar
  sentence_text: The mechanism by which the drug operates has not been fully elucidated.
  output_fragment: '{"type": "grammar_note", "spans": [{"text": "by which"}, {"text":
    "has not been"}], "label": "介词+关系代词 + 被动语态", "note_zh": "by which 引导定语从句修饰 mechanism，说明药物“通过什么机制”起作用。has
    not been fully elucidated 是被动语态，动作执行者被省略（学术界惯例）。被动语态在学术文本中极常见（约 30-40% 的句子），需注意动作执行者是被省略了还是在
    by 后面"}'
- example_type: sentence_analysis
  sentence_text: Although traditional methods have proven effective in certain contexts,
    the emerging approach offers significant advantages, particularly in terms of
    efficiency and scalability.
  output_fragment: '{"type": "sentence_analysis", "label": "让步（承认传统方法价值）+ 转折（提出新方法优势）+
    限定（适用范围）", "analysis_zh": "主干：the emerging approach offers significant advantages（新方法具有显著优势）。although
    引导让步从句，承认传统方法的价值，为转折做铺垫。particularly in terms of... 限定了优势的适用范围——效率和可扩展性。这句在段落中的功能是提出核心论点并限定适用范围。TOEFL
    可能考“为什么作者提到传统方法的优势？”（答案：让步，为转折做铺垫）。IELTS 的 T/F/NG 可能将“新方法在所有方面都优于传统方法”设为 False（因为原文有
    particularly 限定）", "chunks": [{"order": 1, "label": "让步从句", "text": "Although
    traditional methods have proven effective in certain contexts"}, {"order": 2,
    "label": "核心主张", "text": "the emerging approach offers significant advantages"},
    {"order": 3, "label": "限定范围", "text": "particularly in terms of efficiency and
    scalability"}]}'
