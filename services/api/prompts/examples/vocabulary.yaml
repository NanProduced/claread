beginner_reading:
- example_type: vocab
  sentence_text: The weather was very pleasant today.
  output_fragment: '{"type": "vocab_highlight", "text": "pleasant"}'
- example_type: phrase
  sentence_text: He decided to give up smoking.
  output_fragment: '{"type": "phrase_gloss", "label": "give up", "anchor_quotes": [{"text": "give up"}],
    "phrase_type": "phrasal_verb", "zh": "放弃；戒掉。日常很常用，比如 give up smoking（戒烟）、give
    up trying（放弃尝试）"}'
- example_type: phrase
  sentence_text: She takes care of her little brother every day.
  output_fragment: '{"type": "phrase_gloss", "label": "takes care of", "anchor_quotes": [{"text":
    "takes care of"}], "phrase_type": "collocation", "zh": "照顾；照看。日常超常用，比如 take
    care of yourself（照顾好自己）"}'
default:
- example_type: phrase
  sentence_text: The documentary scored 100 per cent on Rotten Tomatoes.
  output_fragment: '{"type": "phrase_gloss", "label": "scored 100 per cent", "anchor_quotes":
    [{"text": "scored 100 per cent"}], "phrase_type": "collocation", "zh": "获得百分之百的评分"}'
- example_type: phrase
  sentence_text: People often refer to this pattern as a shortcut.
  output_fragment: '{"type": "phrase_gloss", "label": "refer to ... as", "anchor_quotes":
    [{"text": "refer to"}, {"text": "as"}], "phrase_type": "collocation", "zh":
    "把……称作……"}'
- example_type: context
  sentence_text: The government has been slow to address the issue.
  output_fragment: '{"type": "context_gloss", "display": "address", "anchor_quotes": [{"text": "address"}], "gloss": "处理；应对",
    "reason": "address 常见义为\"地址\"或\"演讲\"，此处是\"着手处理问题\"的语境义"}'
- example_type: context
  sentence_text: The visuals rendered the ancient world far more vivid than earlier
    documentaries.
  output_fragment: '{"type": "context_gloss", "display": "rendered", "anchor_quotes": [{"text": "rendered"}], "gloss": "把…呈现出来",
    "reason": "render 常见义为\"使得\"或\"渲染\"，此处表示视觉上把远古世界呈现出来"}'
intensive_reading:
- example_type: context
  sentence_text: The architect's design was a subtle nod to brutalism.
  output_fragment: '{"type": "context_gloss", "display": "nod to", "anchor_quotes": [{"text": "nod to"}], "gloss": "致敬；呼应",
    "reason": "nod 原指点头，此处修辞性地表示设计上对某种风格的隐喻性致敬，体现了选词的委婉与深度"}'
- example_type: vocab
  sentence_text: His arguments were both pellucid and persuasive.
  output_fragment: '{"type": "vocab_highlight", "text": "pellucid"}'
- example_type: context
  sentence_text: The policy was less a reform than a cosmetic tweak.
  output_fragment: '{"type": "context_gloss", "display": "cosmetic", "anchor_quotes": [{"text": "cosmetic"}], "gloss": "表面上的；装点门面的",
    "reason": "cosmetic 本义\"化妆品的\"，此处隐喻政策改动只是表面功夫，未触及实质。选词本身带有讽刺意味"}'
gaokao:
- example_type: phrase
  sentence_text: Soon afterwards, many of those people started settling down to become
    farmers.
  output_fragment: '{"type":"phrase_gloss","label":"settling down","anchor_quotes":[{"text":"settling
    down"}],"phrase_type":"phrasal_verb","zh":"定居；安顿下来"}'
- example_type: context
  sentence_text: It's possible that we all have compromised conversational intelligence.
  output_fragment: '{"type":"context_gloss","display":"compromised","anchor_quotes":[{"text":"compromised"}],"gloss":"受损的；削弱的","reason":"这里修饰
    conversational intelligence，不是常见的‘妥协’，而是说交谈能力下降或受影响；上下文提到人们专注手机或陷入沉默，支持这个负面语境义。"}'
- example_type: phrase
  sentence_text: Old desktop monitors and box TVs with cathode ray tubes are the worst
    devices for energy consumption.
  output_fragment: '{"type":"phrase_gloss","label":"cathode ray tubes","anchor_quotes":[{"text":"cathode
    ray tubes"}],"phrase_type":"compound","zh":"阴极射线管；老式显像管"}'
- example_type: vocab
  sentence_text: Consequently, many small languages are now close to extinction.
  output_fragment: '{"type":"vocab_highlight","text":"Consequently"}'
- example_type: context
  sentence_text: Small talk is the grease for social communication.
  output_fragment: '{"type":"context_gloss","display":"grease","anchor_quotes":[{"text":"grease"}],"gloss":"润滑剂","reason":"grease本义是油脂，这里是比喻义：small talk 像润滑剂一样减少社交阻力，让 social communication 更顺畅。"}'
cet:
