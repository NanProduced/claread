[project]
name = "claread-api"
version = "0.1.0"
description = "Claread透读后端服务"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116.1,<0.117.0",
    "httpx>=0.28.1,<0.29.0",
    "langgraph>=0.6.6,<0.7.0",
    "langsmith[otel]>=0.4.26,<0.5.0",
    "opentelemetry-exporter-otlp>=1.39.0,<2.0.0",
    "orjson>=3.11.1,<4.0.0",
    "pydantic-ai>=1.107.0,<2.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    # 数据库
    "asyncpg>=0.31.0,<0.32.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    # 文本预处理
    "spacy>=3.8.0,<4.0.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Redis（可选，redis_enabled=False 时不阻塞启动）
    "redis>=5.2.0,<6.0.0",
    # 词典 lemma fallback
    "lemminflect>=0.2.3,<1.0.0",
    # 每日精读文章拉取
    "feedparser>=6.0.0,<7.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    # Prompt YAML 加载
    "pyyaml>=6.0,<7.0",
    # Offline bundled Public Suffix List lookup for Web Search source diversity.
    "tldextract>=5.1.3,<6.0.0",
    # Grammar RAG 向量数据库
    "pymilvus>=2.4.0,<3.0.0",
    # Grammar RAG 百炼 Embedding & Rerank
    "dashscope>=1.25.23,<2.0.0",
    # Structured Source parser (M1): CommonMark + GFM table/strikethrough/footnote.
    # Promoted from dev to main dependency so the production normalizer /
    # candidate / gate can import markdown_source_parser without a dev extra.
    "markdown-it-py>=3.0.0,<4.0.0",
    "mdit-py-plugins>=0.4.0,<1.0.0",
    # AUTH-F2A: email auth primitives. email-validator previously entered the
    # graph only transitively (pydantic[email] via pydantic-ai); auth code now
    # imports it directly, so it is promoted to a direct dependency.
    "email-validator>=2.3.0,<3.0.0",
    # AUTH-F2A: Argon2id password hashing.
    "argon2-cffi>=23.1.0,<26.0.0",
]

# OSS-backed artifact IO (AliyunOssObjectReader / AliyunOssPresigner).
# oss2 是可选依赖：缺省 fail closed（NullPresigner / 读取时报 oss_sdk_missing），
# 安装 ``pip install -e ".[oss]"`` 后才启用真实 OSS 读写。
[project.optional-dependencies]
oss = ["oss2>=2.18.0,<3.0.0"]
pdf = ["pypdf>=4.0.0,<6.0.0"]

[dependency-groups]
dev = [
    "mypy>=1.17.1,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "ruff>=0.12.8,<0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE (oss extra): the optional [oss] extra pulls in oss2 → aliyun-python-sdk-core,
# which requires jmespath<1.0.0. Since uv lock resolves all extras into a single
# lockfile, this downgrades jmespath from 1.1.0 to 0.10.0 in the shared graph.
# This is unavoidable while the [oss] extra is declared here: pinning
# jmespath>=1.0.0 via constraint-dependencies makes the oss extra unsatisfiable.
# The downgrade is accepted because (a) no repo code imports jmespath directly,
# (b) botocore/boto3 work with jmespath 0.10.0 (no version upper bound), and
# (c) all tests pass. If a future STS/proxy model removes the need for oss2,
# jmespath will naturally return to 1.x.

[project.scripts]
reader-enhancement-worker = "scripts.run_reader_enhancement_worker:main"
reader-artifact-pipeline-worker = "scripts.run_reader_artifact_pipeline_worker:main"
reader-article-rag-index-worker = "scripts.run_reader_article_rag_index_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    "real_llm: calls a real LLM provider; requires CLAREAD_ALLOW_REAL_LLM_TESTS=1 + CLAREAD_REAL_LLM_MODEL=<model> + -m real_llm",
    "article_rag_smoke: opt-in real-provider Article RAG integration smoke; requires READER_ARTICLE_RAG_SMOKE=1 + -m article_rag_smoke",
    "no_network_default: default-passes I4Y test that must not hit any real network / LLM / vector store",
    # Flat governance markers (TG-FOUNDATION): composable with plain
    # `pytest -m`, no plugins. Marking existing tests is progressive and
    # NOT required yet; --strict-markers only forbids undeclared markers.
    # business chains (chain_*) — one per test file
    "chain_reader_parse: business chain — reader parse (markdown input / stable document / providers / extraction)",
    "chain_reader_orchestration: business chain — reader orchestration (three-mode routing / section / semantic outline)",
    "chain_reading_record: business chain — reading record (layer publish / lifecycle)",
    "chain_reader_ask: business chain — ask claread (route boundary / trace semantics / agentic activity)",
    "chain_article_rag: business chain — article rag (index plan/bootstrap/worker/adapters/retrieval/context/prompt/runtime/lifecycle/routes)",
    "chain_markdown_input: business chain — markdown input (pasted_text / txt_file / code_dominant)",
    "chain_vocabulary: business chain — vocabulary / dictionary",
    "chain_console_eval: business chain — console/eval infrastructure (judge/runner/bridge/node-lab)",
    "chain_auth: business chain — auth (routes/identity/phone/wechat)",
    "chain_infra: business chain — infrastructure (migration / config / generic)",
    # seams (seam_*) — one per test file
    "seam_pure_unit: pure unit, in-memory, no DB/no network",
    "seam_service_integration: service integration, temp schema + asyncpg / fake executor",
    "seam_api_contract: API contract, TestClient",
    "seam_cross_app_contract: cross-app contract, reader<->ask<->article_rag",
    "seam_real_llm: real-LLM provider call",
    # lifecycle (life_*) — a test file may carry several
    "life_permanent_regression: permanent regression, must always pass",
    "life_migration_guard: migration guard, retire only after legacy workflow offline",
    "life_characterization: characterization, locks historical field semantics",
    "life_spike: spike, no exit condition yet, retire-when documented",
    "life_temporary_compatibility: temporary compatibility, retire-when documented",
    "life_external_smoke: external provider smoke",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
