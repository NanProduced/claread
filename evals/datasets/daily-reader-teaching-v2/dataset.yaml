schema_version: 2
id: daily-reader-teaching-v2
description: >-
  Daily Reader teaching-contract v2 gold set. Ten frozen real articles
  (BBC x8, NPR x2; three recast verbatim from the v1 regression
  snapshots keeping their original captured_at, seven captured read-only
  on 2026-08-21): four news_report, two opinion_commentary, two
  explainer, two narrative_profile; B1 x4, B2 x3, C1 x3; one reject
  (transcript skeleton), two dirty cleaned_publish cases, one short
  (<800 words) and one long (>=1500 words) article. All gold is
  DRAFT_PM_REVIEW; human approval is never written by this package.
case_globs:
  - cases/*.json
review_globs:
  - reviews/*.json
tags:
  - daily-reader
  - teaching-v2
  - p2
