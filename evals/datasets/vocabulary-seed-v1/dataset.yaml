schema_version: 1
id: vocabulary-seed-v1
description: >-
  D5-V3 vocabulary worker deterministic eval seed. Each case carries a unit
  with anchor segments, gold items, and the deterministic execution snapshot
  produced by re-running the resolver deterministically. Coverage of no-value,
  single highlight, phrase-vs-highlight priority, context-vs-phrase priority,
  ambiguous selected_text, missing selected_text, unknown anchor segment,
  same-span conflict, unicode exact-match pitfalls, UTF-16 surrogate offsets,
  diagnostics truncation, and empty-output diagnostics.
case_globs:
  - cases/*.json
tags:
  - vocabulary
  - d5-v3
  - deterministic